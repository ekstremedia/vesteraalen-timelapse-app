name: vesteraalen_timelapse
description: "Live camera images and timelapses from Northern Norway"
publish_to: 'none'

version: 1.7.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Image Caching
  cached_network_image: ^3.4.1

  # Typography
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.3

  # YouTube Player
  youtube_player_flutter: ^9.1.3

  # Date/Time Formatting
  intl: any

  # Environment Config
  flutter_dotenv: ^6.0.0

  # URL Launcher (for external links)
  url_launcher: ^6.3.1

  # WebSocket for real-time updates
  web_socket_channel: ^3.0.2

  # SVG support
  flutter_svg: ^2.0.17

  # Package info (version, build number)
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Mocking for tests
  mocktail: ^1.0.4

  # Riverpod testing
  riverpod_test: ^0.1.0

  # App icon generator
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.example
    - images/
    - assets/icons/
