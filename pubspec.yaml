name: vesteraalen_timelapse
description: "Live camera images and timelapses from Northern Norway"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Image Caching
  cached_network_image: ^3.4.1

  # Typography
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.3.3

  # YouTube Player (cross-platform)
  youtube_player_iframe: ^5.2.0

  # Date/Time Formatting
  intl: ^0.20.1

  # Environment Config
  flutter_dotenv: ^5.2.1

  # URL Launcher (for external links)
  url_launcher: ^6.3.1

  # SVG support
  flutter_svg: ^2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Mocking for tests
  mocktail: ^1.0.4

  # Riverpod testing
  riverpod_test: ^0.1.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - .env.example
    - images/
