name: iOS Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for this build'
        required: false
        default: 'New build'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env file
        run: |
          echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > .env
          echo "POLLING_INTERVAL=${{ vars.POLLING_INTERVAL || '60' }}" >> .env
          echo "WEBSOCKET_ENABLED=true" >> .env
          echo "REVERB_HOST=ekstremedia.no" >> .env
          echo "REVERB_PORT=443" >> .env
          echo "REVERB_SCHEME=https" >> .env
          echo "REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}" >> .env

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Increment build number
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          sed -i '' "s/version: \(.*\)+.*/version: \1+$BUILD_NUMBER/" pubspec.yaml

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Build Archive
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath Runner.xcarchive \
            archive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        run: |
          cd ios
          xcodebuild -exportArchive \
            -archivePath Runner.xcarchive \
            -exportPath export \
            -exportOptionsPlist ExportOptions.plist
          echo "Exported files:"
          ls -laR export/

      - name: Find and verify IPA
        id: find-ipa
        run: |
          echo "Looking for IPA files..."
          find ios/export -name "*.ipa" -type f
          IPA_PATH=$(find ios/export -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA file found in ios/export/"
            ls -laR ios/export/
            exit 1
          fi
          echo "Found IPA at: $IPA_PATH"
          echo "File size: $(ls -la "$IPA_PATH")"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          # Create API key directory
          mkdir -p ~/.appstoreconnect/private_keys

          # Write API key to expected location
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

          # Get IPA path
          IPA_PATH="${{ steps.find-ipa.outputs.IPA_PATH }}"
          echo "Uploading IPA: $IPA_PATH"

          # Upload using xcrun altool
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --apiIssuer "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/export/*.ipa
